[project]
name = "claimpulse-agent"
version = "0.1.0"
description = "Autonomous Multi-Agent Insurance Claim Intake, 3-Tier Triage & Emergency Roadside Dispatch System on Vertex AI Agent Runtime"
authors = [
    {name = "Claudio Urbina", email = "claudiourbina@google.com"},
]


dependencies = [
    "google-adk>=1.0.0,<3.0.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "opentelemetry-sdk>=1.25.0",
    "gcsfs>=2024.11.0",
    "a2a-sdk[http-server]>=0.2.0,<2",
    "aiohttp>=3.10.0",
    "google-cloud-logging>=3.10.0,<4.0.0",
    "google-cloud-bigquery>=3.20.0,<4.0.0",
    "google-cloud-bigquery-storage>=2.24.0,<3.0.0",
    "google-cloud-aiplatform[evaluation,agent-engines]>=1.90.0,<2.0.0",
    "google-cloud-firestore>=2.19.0,<3.0.0",
    "protobuf>=5.26.0,<7.0.0",
]
requires-python = ">=3.11,<3.14"


[dependency-groups]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=1.0.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.90.0,<2.0.0"
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901", "B006"] # ignore line too long, too complex

[tool.ruff.lint.isort]
known-first-party = ["app", "frontend"]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv)
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.rules]
# Ignore common issues with third-party libraries and dynamic code patterns
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[tool.codespell]
ignore-words-list = "rouge,leve,cliente"
skip = "./locust_env/*,uv.lock,.venv,./frontend,**/package-lock.json"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["app","frontend"]


